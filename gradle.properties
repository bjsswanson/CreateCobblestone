org.gradle.jvmargs = -Xmx2G

# Mod Info
archives_base_name = createcobblestone
mod_version = 1.4.3
maven_group = net.createcobblestone

minecraft_version = 1.18.2
enabled_platforms = fabric,forge

# Mappings
# https://lambdaurora.dev/tools/import_quilt.html
